openapi: 3.1.0
info:
  title: Сторож сделок API
  version: 1.1.0
  description: |
    Контракт между фронтендом и бэкендом, синхронизирован с ТЗ 1.1 (01-dev1, 02-dev2, 03-dev3).
    Меняется только PR с двумя апрувами (см. contracts/README.md).
    Ошибки — application/problem+json (RFC 9457), списки — курсорная пагинация, все ответы несут X-Request-Id.
    Во время разработки фронтенд ходит в Prism-мок по этому файлу: make mock.
servers:
  - url: http://localhost:8000
    description: живой API
  - url: http://localhost:4010
    description: Prism-мок

tags:
  - {name: platform, description: Разработчик 2}
  - {name: documents, description: Разработчик 1}
  - {name: guard, description: Разработчик 3}
  - {name: assistant, description: Разработчик 2}
  - {name: internal, description: Подписанные HMAC внутренние вызовы}

paths:
  # ---------------- Платформа (Разработчик 2) ----------------
  /healthz:
    get:
      tags: [platform]
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {status: {const: ok}}}
  /auth/telegram/start:
    post:
      tags: [platform]
      operationId: authTelegramStart
      summary: Начать вход — ссылка на бота с login_<nonce> (5 минут)
      responses:
        "200":
          description: Ссылка для перехода в Telegram
          content:
            application/json:
              schema:
                type: object
                required: [deep_link]
                properties:
                  deep_link: {type: string, example: "https://t.me/storozh_bot?start=login_abc"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/callback:
    get:
      tags: [platform]
      operationId: authCallback
      summary: Одноразовая ссылка из бота → cookie сессии → редирект на /documents
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Редирект в кабинет, cookie __Host-session выставлена}
        default: {$ref: "#/components/responses/Problem"}
  /auth/logout:
    post:
      tags: [platform]
      operationId: authLogout
      responses:
        "204": {description: Сессия отозвана}
        default: {$ref: "#/components/responses/Problem"}
  /me:
    get:
      tags: [platform]
      operationId: me
      responses:
        "200":
          description: Текущий гражданин
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Problem"}
  /stream:
    get:
      tags: [platform]
      operationId: stream
      summary: SSE — document.*, alert.created, action.updated, summary.ready текущего гражданина; heartbeat 15 с
      description: "Каждое сообщение — `event: <type>`, `data: <конверт события>` (contracts/events/envelope.schema.json)."
      responses:
        "200":
          description: Поток событий
          content:
            text/event-stream:
              schema: {type: string}
  /audit:
    get:
      tags: [platform]
      operationId: listAudit
      parameters: [{$ref: "#/components/parameters/Cursor"}]
      responses:
        "200":
          description: Журнал аудита гражданина
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
                  next_cursor: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Problem"}
  /audit/verify:
    get:
      tags: [platform]
      operationId: verifyAudit
      responses:
        "200":
          description: Целостность цепочки хешей
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
                  broken_seq: {type: [integer, "null"]}
        default: {$ref: "#/components/responses/Problem"}

  # ---------------- Документы (Разработчик 1) ----------------
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Лента документов, сортировка по updated_at desc
      parameters:
        - {name: kind, in: query, schema: {$ref: "#/components/schemas/DocumentKind"}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/DocumentStatus"}}
        - {name: q, in: query, schema: {type: string}, description: поиск по названию и маске номера}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Страница ленты
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DocumentListItem"}}
                  next_cursor: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Problem"}
  /documents/{document_id}:
    get:
      tags: [documents]
      operationId: getDocument
      parameters: [{$ref: "#/components/parameters/DocumentId"}]
      responses:
        "200":
          description: Карточка документа
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentDetail"}
        default: {$ref: "#/components/responses/Problem"}
  /documents/{document_id}/versions:
    get:
      tags: [documents]
      operationId: listDocumentVersions
      parameters: [{$ref: "#/components/parameters/DocumentId"}]
      responses:
        "200":
          description: История версий, новые сверху
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/DocumentVersion"}}
        default: {$ref: "#/components/responses/Problem"}
  /documents/{document_id}/versions/{version_no}/diff:
    get:
      tags: [documents]
      operationId: getVersionDiff
      summary: Что изменилось относительно версии n−1
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
        - {name: version_no, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Изменённые поля
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/DiffEntry"}}
        default: {$ref: "#/components/responses/Problem"}
  /sources:
    get:
      tags: [documents]
      operationId: listSources
      summary: Статус источников — доказательство, что данные живые
      responses:
        "200":
          description: Источники гражданина
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Source"}}
        default: {$ref: "#/components/responses/Problem"}
  /sources/{source_id}/refresh:
    post:
      tags: [documents]
      operationId: refreshSource
      summary: Внеочередной опрос источника; не чаще раза в 20 с (иначе 429)
      parameters:
        - {name: source_id, in: path, required: true, schema: {type: string, example: mygov.car_poa}}
      responses:
        "202": {description: Опрос запланирован}
        default: {$ref: "#/components/responses/Problem"}
  /internal/ingest/snapshots:
    post:
      tags: [internal]
      operationId: ingestSnapshot
      summary: Единственный вход данных. HMAC-SHA256 в X-Signature, метка времени в X-Timestamp (окно 5 минут)
      parameters:
        - {$ref: "#/components/parameters/XSignature"}
        - {$ref: "#/components/parameters/XTimestamp"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./schemas/source_snapshot.schema.json"}
      responses:
        "202":
          description: Принято. Повтор snapshot_id — тоже 202 и new_versions = 0
          content:
            application/json:
              schema:
                type: object
                required: [new_versions]
                properties:
                  new_versions: {type: integer}
        default: {$ref: "#/components/responses/Problem"}
  /internal/documents/{document_id}/refresh:
    post:
      tags: [internal]
      operationId: refreshDocument
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
        - {$ref: "#/components/parameters/XSignature"}
        - {$ref: "#/components/parameters/XTimestamp"}
      responses:
        "202": {description: Внеочередной опрос запланирован}
        default: {$ref: "#/components/responses/Problem"}

  # ---------------- Сторож (Разработчик 3) ----------------
  /guard/alerts:
    get:
      tags: [guard]
      operationId: listAlerts
      parameters:
        - {name: status, in: query, schema: {$ref: "#/components/schemas/AlertStatus"}}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Тревоги, сначала важные и новые
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Alert"}}
                  next_cursor: {type: [string, "null"]}
        default: {$ref: "#/components/responses/Problem"}
  /guard/alerts/{alert_id}/verdict:
    post:
      tags: [guard]
      operationId: setAlertVerdict
      parameters: [{name: alert_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict: {enum: [me, not_me]}
      responses:
        "200":
          description: Тревога с вердиктом
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Alert"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/documents/{document_id}/alerts:
    get:
      tags: [guard]
      operationId: listDocumentAlerts
      summary: Тревоги по документу — для <DocumentGuard/>
      parameters: [{$ref: "#/components/parameters/DocumentId"}]
      responses:
        "200":
          description: Тревоги документа
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}
        default: {$ref: "#/components/responses/Problem"}
  /guard/actions:
    post:
      tags: [guard]
      operationId: createAction
      summary: Шаг 1 — запросить действие; 6-значный код уходит в привязанный Telegram
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, type]
              properties:
                document_id: {type: string, format: uuid}
                type: {$ref: "#/components/schemas/ActionType"}
      responses:
        "201":
          description: Действие ждёт подтверждения. Повтор с тем же ключом возвращает то же действие
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Action"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/actions/{action_id}:
    get:
      tags: [guard]
      operationId: getAction
      parameters: [{$ref: "#/components/parameters/ActionId"}]
      responses:
        "200":
          description: Действие и его ход
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Action"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/actions/{action_id}/confirm:
    post:
      tags: [guard]
      operationId: confirmAction
      summary: Шаг 2 — код из Telegram (2 минуты, 3 попытки; потом 429)
      parameters: [{$ref: "#/components/parameters/ActionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: "^[0-9]{6}$"}
      responses:
        "200":
          description: Код принят, действие исполняется
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Action"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/actions/{action_id}/evidence:
    get:
      tags: [guard]
      operationId: getActionEvidence
      summary: Скриншот результата действия
      parameters: [{$ref: "#/components/parameters/ActionId"}]
      responses:
        "200":
          description: PNG
          content:
            image/png:
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Problem"}
  /guard/drafts:
    post:
      tags: [guard]
      operationId: createDraft
      summary: Черновик заявления (ст. 31 или иск) через assistant.draft_application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, type]
              properties:
                document_id: {type: string, format: uuid}
                type: {$ref: "#/components/schemas/DraftType"}
      responses:
        "200":
          description: Ссылка на PDF
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DraftRef"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/telegram/link:
    post:
      tags: [guard]
      operationId: telegramLink
      summary: Привязать Telegram — ссылка t.me/<bot>?start=link_<token> (10 минут)
      responses:
        "200":
          description: Ссылка на бота
          content:
            application/json:
              schema:
                type: object
                required: [deep_link]
                properties:
                  deep_link: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /guard/family:
    get:
      tags: [guard]
      operationId: getFamily
      responses:
        "200":
          description: Кому я дал доступ и кто дал доступ мне
          content:
            application/json:
              schema:
                type: object
                required: [i_share_with, shared_with_me]
                properties:
                  i_share_with: {type: array, items: {$ref: "#/components/schemas/Consent"}}
                  shared_with_me: {type: array, items: {$ref: "#/components/schemas/Consent"}}
        default: {$ref: "#/components/responses/Problem"}
  /guard/consents/invite:
    post:
      tags: [guard]
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes: {type: array, items: {$ref: "#/components/schemas/ConsentScope"}}
      responses:
        "200":
          description: Код приглашения для родственника
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /guard/consents/accept:
    post:
      tags: [guard]
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        "200":
          description: Согласие выдано
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Consent"}
        default: {$ref: "#/components/responses/Problem"}
  /guard/consents/{consent_id}:
    delete:
      tags: [guard]
      operationId: revokeConsent
      parameters: [{name: consent_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "204": {description: Отозвано сразу}
        default: {$ref: "#/components/responses/Problem"}

  # ---------------- Помощник (Разработчик 2) ----------------
  /assist/documents/{document_id}/summary:
    get:
      tags: [assistant]
      operationId: getSummary
      parameters:
        - {$ref: "#/components/parameters/DocumentId"}
        - {name: lang, in: query, schema: {$ref: "#/components/schemas/Lang"}}
      responses:
        "200":
          description: Резюме текущей версии
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Summary"}
        "202": {description: Ещё считается — придёт summary.ready в /stream}
        default: {$ref: "#/components/responses/Problem"}
  /assist/chat:
    post:
      tags: [assistant]
      operationId: chat
      summary: Вопрос по документу; ответ потоком SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, message]
              properties:
                document_id: {type: string, format: uuid}
                message: {type: string, maxLength: 2000}
                lang: {$ref: "#/components/schemas/Lang"}
      responses:
        "200":
          description: "event: token (кусок текста), event: citations (Citation[]), event: done"
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /assist/chat/{document_id}:
    get:
      tags: [assistant]
      operationId: chatHistory
      parameters: [{$ref: "#/components/parameters/DocumentId"}]
      responses:
        "200":
          description: История чата по документу
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ChatMessage"}}
        default: {$ref: "#/components/responses/Problem"}
  /assist/search:
    get:
      tags: [assistant]
      operationId: searchLaw
      summary: Гибридный поиск по корпусу lex.uz (отладка RAG)
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: k, in: query, schema: {type: integer, default: 8}}
        - {name: rerank, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Найденные статьи
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/LawHit"}}
  /assist/ask:
    post:
      tags: [assistant]
      operationId: askLaw
      summary: Вопрос агенту без документа (отладка RAG)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: {type: string}
      responses:
        "200":
          description: Ответ со ссылками
          content:
            application/json:
              schema:
                type: object
                required: [answer, citations]
                properties:
                  answer: {type: string}
                  citations: {type: array, items: {type: object}}
                  unverified: {type: array, items: {type: string}}
                  tool_calls: {type: integer}

components:
  parameters:
    Cursor: {name: cursor, in: query, schema: {type: string}, description: непрозрачный курсор из next_cursor}
    DocumentId: {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
    ActionId: {name: action_id, in: path, required: true, schema: {type: string, format: uuid}}
    XSignature: {name: X-Signature, in: header, required: true, schema: {type: string}}
    XTimestamp: {name: X-Timestamp, in: header, required: true, schema: {type: integer}}

  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}

    Lang: {enum: [uz, ru]}
    DocumentKind: {enum: [notarial_act, poa_notarial, poa_car, ban, real_estate_right, vehicle, loan, enforcement_case, labor_contract, application, notification, company, tax_assessment]}
    DocumentStatus: {enum: [active, completed, revoked, expired, unknown]}
    ActionType: {enum: [revoke_car_poa]}
    ActionStatus: {enum: [proposed, awaiting_confirmation, confirmed, executing, verifying, done, failed, expired]}
    AlertStatus: {enum: [new, seen, closed]}
    Severity: {enum: [critical, high, info]}
    DraftType: {enum: [art31_postpone, court_claim]}
    ConsentScope: {enum: [read_documents, receive_alerts]}

    NormalizedDocument: {$ref: "./schemas/normalized_document.schema.json"}

    Me:
      type: object
      required: [id, display_name, lang]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, example: "Азиз А."}
        lang: {$ref: "#/components/schemas/Lang"}

    DocumentListItem:
      type: object
      required: [id, uri, kind, title, status, owner_role, source, is_new, updated_at]
      properties:
        id: {type: string, format: uuid}
        uri: {type: string, example: "uz:notarius:poa:2026-0001234"}
        kind: {$ref: "#/components/schemas/DocumentKind"}
        title: {type: string, example: "Доверенность на автомобиль"}
        status: {$ref: "#/components/schemas/DocumentStatus"}
        owner_role: {type: string, example: principal}
        source: {type: string, example: mygov.car_poa}
        number_masked: {type: [string, "null"], example: "2026-***234"}
        counterparty_masked: {type: [string, "null"], example: "Б***р К."}
        object_label: {type: [string, "null"], example: "Chevrolet Cobalt · 01 *** 45"}
        issued_at: {type: [string, "null"], format: date}
        is_new: {type: boolean}
        updated_at: {type: string, format: date-time}

    DocumentDetail:
      description: NormalizedDocument + метаданные хранения
      allOf:
        - {$ref: "#/components/schemas/NormalizedDocument"}
        - type: object
          required: [id, current_version, versions_count, first_seen_at, last_seen_at]
          properties:
            id: {type: string, format: uuid}
            current_version: {type: integer}
            versions_count: {type: integer}
            first_seen_at: {type: string, format: date-time}
            last_seen_at: {type: string, format: date-time}

    DocumentVersion:
      type: object
      required: [version_no, content_hash, fetched_at, changed_fields]
      properties:
        version_no: {type: integer}
        content_hash: {type: string}
        fetched_at: {type: string, format: date-time}
        changed_fields: {type: array, items: {type: string}}

    DiffEntry:
      type: object
      required: [field]
      properties:
        field: {type: string, example: status}
        from: {example: active}
        to: {example: revoked}

    Source:
      type: object
      required: [source_id, title, status]
      properties:
        source_id: {type: string, example: mygov.car_poa}
        title: {type: string, example: "my.gov.uz · e-доверенности на авто"}
        status: {enum: [ok, error, expired, disabled]}
        last_poll_at: {type: [string, "null"], format: date-time}
        last_ok_at: {type: [string, "null"], format: date-time}
        last_error: {type: [string, "null"]}
        poll_interval_s: {type: integer, example: 20}

    Alert:
      type: object
      required: [id, rule_id, severity, title, status, buttons, created_at]
      properties:
        id: {type: string, format: uuid}
        document_id: {type: [string, "null"], format: uuid}
        rule_id: {type: string, example: G1}
        severity: {$ref: "#/components/schemas/Severity"}
        title: {type: string, example: "От вашего имени выдана доверенность"}
        explanation: {type: [string, "null"]}
        verdict: {enum: [me, not_me, null]}
        status: {$ref: "#/components/schemas/AlertStatus"}
        buttons: {type: array, items: {type: string, example: not_me_revoke}}
        created_at: {type: string, format: date-time}

    Action:
      type: object
      required: [id, type, document_id, status, steps]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/ActionType"}
        document_id: {type: string, format: uuid}
        status: {$ref: "#/components/schemas/ActionStatus"}
        steps:
          type: array
          items:
            type: object
            required: [status, at]
            properties:
              status: {$ref: "#/components/schemas/ActionStatus"}
              at: {type: string, format: date-time}
        attempts_left: {type: integer}
        confirm_expires_at: {type: [string, "null"], format: date-time}
        result:
          type: [object, "null"]
          properties:
            verified_status: {type: string, example: revoked}
            error: {type: [string, "null"]}

    DraftRef:
      type: object
      required: [draft_id, url]
      properties:
        draft_id: {type: string, format: uuid}
        url: {type: string}

    Consent:
      type: object
      required: [id, grantor, grantee, scopes, granted_at]
      properties:
        id: {type: string, format: uuid}
        grantor: {$ref: "#/components/schemas/Person"}
        grantee: {$ref: "#/components/schemas/Person"}
        scopes: {type: array, items: {$ref: "#/components/schemas/ConsentScope"}}
        granted_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}

    Person:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}

    AuditEntry:
      type: object
      required: [seq, actor, action, target, at, hash]
      properties:
        seq: {type: integer}
        actor: {type: string}
        action: {type: string}
        target: {type: string}
        at: {type: string, format: date-time}
        hash: {type: string}

    Citation:
      type: object
      required: [act_title, article, url]
      properties:
        act_title: {type: string, example: "Закон «О нотариате»"}
        article: {type: string, example: "31"}
        url: {type: string, example: "https://www.lex.uz/acts/57043"}

    Summary:
      type: object
      required: [document_id, version_no, lang, what_is_it, counterparty_can, risks, what_to_do, citations]
      properties:
        document_id: {type: string, format: uuid}
        version_no: {type: integer}
        lang: {$ref: "#/components/schemas/Lang"}
        what_is_it: {type: string, example: "Доверенность на управление и продажу вашего автомобиля"}
        counterparty_can: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
        what_to_do: {type: array, items: {type: string}}
        citations: {type: array, items: {$ref: "#/components/schemas/Citation"}}

    ChatMessage:
      type: object
      required: [id, role, text, citations, created_at]
      properties:
        id: {type: string, format: uuid}
        role: {enum: [user, assistant]}
        text: {type: string}
        citations: {type: array, items: {$ref: "#/components/schemas/Citation"}}
        created_at: {type: string, format: date-time}

    LawHit:
      type: object
      properties:
        code: {type: string}
        number: {type: string}
        title: {type: string}
        lang: {type: string}
        url: {type: string}
        score: {type: number}
        text: {type: string}
