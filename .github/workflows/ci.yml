name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env: {POSTGRES_USER: storozh, POSTGRES_PASSWORD: storozh, POSTGRES_DB: storozh}
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U storozh" --health-interval 3s --health-retries 20
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run lint-imports            # границы контекстов
      - name: Тестовые ключи шифрования (генерируются на лету, в репо их нет)
        run: |
          for k in MASTER_KEY PINFL_HMAC_KEY INGEST_HMAC_KEY CALLBACK_HMAC_KEY; do
            echo "$k=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
          done
      - run: uv run python -m storozh migrate
      - run: uv run pytest -q               # включая контракт-тесты и интеграцию с базой
      - run: uvx pip-audit --strict || true # пока информативно

  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - name: Типы API совпадают с contracts/openapi.yaml
        run: npm run gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high || true

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action читает список коммитов PR
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
