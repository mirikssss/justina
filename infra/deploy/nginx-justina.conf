# /etc/nginx/sites-available/justina.clusteros.co.uz  (затем ln -s в sites-enabled, nginx -t, reload, certbot --nginx)
server {
    listen 80;
    server_name justina.clusteros.co.uz;

    # внутренние эндпоинты (снимки сборщика) не должны быть доступны снаружи
    location ^~ /api/internal/ { return 404; }
    # T8: схема API и Swagger наружу не нужны (в проде их выключает и само приложение: DOCS_ENABLED=false)
    location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (/api/stream): без буферизации и с долгим таймаутом
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
