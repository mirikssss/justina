# Из корня репо проще через Makefile: make up | make db | make mock.
# docker compose -f infra/docker-compose.yml up             — всё: база, миграции, API, воркеры, бот, веб
# docker compose -f infra/docker-compose.yml up db migrate  — только база (для uv run / npm run dev)
# docker compose -f infra/docker-compose.yml --profile mock up mock — Prism-мок по contracts/openapi.yaml на :4010
x-backend: &backend
  build: {context: .., dockerfile: backend/Dockerfile, target: base}
  env_file: [../.env]
  environment:
    DATABASE_URL: postgresql://storozh:storozh@db:5432/storozh
  depends_on:
    migrate: {condition: service_completed_successfully}
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: storozh
      POSTGRES_PASSWORD: storozh
      POSTGRES_DB: storozh
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storozh"]
      interval: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["python", "-m", "storozh", "migrate"]
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  api:
    <<: *backend
    command: ["python", "-m", "storozh", "api"]
    ports: ["8000:8000"]
    volumes: [hfcache:/root/.cache/huggingface]   # модель эмбеддингов не качается заново после каждого деплоя

  collector:      # Разработчик 1
    <<: *backend
    build: {context: .., dockerfile: backend/Dockerfile, target: browser}
    command: ["python", "-m", "storozh", "worker", "collector"]

  guard-worker:   # Разработчик 3
    <<: *backend
    build: {context: .., dockerfile: backend/Dockerfile, target: browser}
    command: ["python", "-m", "storozh", "worker", "guard"]

  bot:            # Разработчик 3
    <<: *backend
    command: ["python", "-m", "storozh", "worker", "bot"]

  assist-worker:  # Разработчик 2
    <<: *backend
    command: ["python", "-m", "storozh", "worker", "assistant"]
    volumes: [hfcache:/root/.cache/huggingface]

  # Разработчик 2. Автоиндексация RAG при каждом up/деплое: корпус lex.uz и индекс пересчитываются, только если
  # изменился код загрузки, нарезки или модель эмбеддингов (отпечатки в assistant.rag_state); иначе — выход за секунды.
  # Первый запуск на пустой базе: ~1 мин скачивание актов + ~3–4 мин эмбеддинги на CPU. Сервис не блокирует остальные.
  rag-index:
    <<: *backend
    command: ["nice", "-n", "10", "python", "-m", "storozh", "rag", "ensure"]
    restart: "no"
    volumes: [hfcache:/root/.cache/huggingface, lexcache:/app/backend/data]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args: {API_PROXY_URL: "http://api:8000"}  # браузер ходит в /api, Next проксирует на API
    ports: ["3000:3000"]
    depends_on: [api]

  mock:
    profiles: [mock]
    image: stoplight/prism:5
    command: ["mock", "-h", "0.0.0.0", "-d", "/contracts/openapi.yaml"]
    volumes: [../contracts:/contracts:ro]
    ports: ["4010:4010"]

volumes:
  pgdata:
  hfcache:    # модели Hugging Face (эмбеддинги)
  lexcache:   # кэш страниц lex.uz
