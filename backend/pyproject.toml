[project]
name = "justina-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "lxml>=5.3",
    "typer>=0.15",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "anthropic>=0.75",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=8.3", "import-linter>=2.1"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Modules talk only through service.py"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.modules.retrieval", "app.modules.reasoning"]
forbidden_modules = [
    "app.modules.corpus.parser",
    "app.modules.corpus.lexuz",
    "app.modules.corpus.repo",
]
