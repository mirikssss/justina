[[tool.importlinter.contracts]]
name = "shared не знает о контекстах"
type = "forbidden"
source_modules = ["storozh.shared"]
forbidden_modules = ["storozh.documents", "storozh.guard", "storozh.assistant", "storozh.platform"]
