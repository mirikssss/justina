# Набор проверки ответов (FR-A-10): 15 вопросов с ожидаемой статьёй.
# ЧЕРНОВИК — составлен по корпусу, нужна вычитка юристом команды (статьи и формулировки).
# expect — любая из перечисленных статей в выдаче считается попаданием. Номер пункта регламента = <приложение>-<пункт>.
# make eval печатает долю попаданий — эту цифру показываем жюри как есть.

- q: "Как отменить доверенность, которую я выдал?"
  lang: ru
